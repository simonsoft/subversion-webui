name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lua-tests:
    name: Lua unit tests (busted)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.3 toolchain and busted dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks libexpat1-dev libpcre2-dev
          sudo luarocks --lua-version=5.3 install luaexpat
          sudo luarocks --lua-version=5.3 install lustache
          sudo luarocks --lua-version=5.3 install busted
          sudo luarocks --lua-version=5.3 install lrexlib-pcre2

      - name: Run busted test suite
        run: busted spec/

  smoketest:
    name: Puppeteer smoke test (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.3 interpreter and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks libexpat1-dev
          sudo luarocks --lua-version=5.3 install luaexpat
          sudo luarocks --lua-version=5.3 install lustache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smoketest/package-lock.json

      - name: Install smoketest dependencies
        run: npm ci
        working-directory: smoketest

      - name: Run Puppeteer smoke test
        run: npm test
        working-directory: smoketest

  build-zip:
    name: Build deployment zip
    needs: [lua-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage deployable files and build zip
        run: |
          mkdir dist
          cp -r mod-lua templates README.md LICENSE dist/
          rm -rf dist/templates/test-custom-override
          cd dist && zip -r ../subversion-webui.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: subversion-webui-zip
          path: subversion-webui.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-zip]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: subversion-webui-zip

      - name: Rename asset to include the tag
        run: mv subversion-webui.zip "subversion-webui-${{ github.ref_name }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: subversion-webui-${{ github.ref_name }}.zip
